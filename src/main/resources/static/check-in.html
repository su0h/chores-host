<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chore Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-light: #F4F4F4;
    --card-yellow: #FFD600;
    --nav-blue: #2962FF;
    --task-white: #FFFFFF;
    --assignee-cyan: #00FFFF;
    --btn-green: #00E676;
    --btn-active: #00B25C;
    --text: #000000;
    --red: #FF1744;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg-light);
    /* Retro dot grid */
    background-image: radial-gradient(var(--text) 2px, transparent 2px);
    background-size: 24px 24px;
    font-family: 'VT323', monospace;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    text-transform: uppercase;
  }

  .frame {
    width: 100%;
    max-width: 400px;
  }

  .card {
    background: var(--card-yellow);
    border: 6px solid var(--text);
    width: 100%;
    padding: 20px 24px 30px;
    text-align: center;
    position: relative;
    /* Main container shadow - Deepest */
    box-shadow: 12px 12px 0px var(--text);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Retro Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    border-bottom: 4px dashed var(--text);
    padding-bottom: 10px;
    margin-bottom: 5px;
  }

  .nav-header {
    background: var(--nav-blue);
    color: var(--task-white);
    font-size: 28px;
    padding: 10px;
    border: 4px solid var(--text);
    box-shadow: 6px 6px 0px var(--text);
    margin-top: 5px;
  }

  /* Merged Task & Assignee Container */
  .task-block {
    background: var(--task-white);
    border: 4px solid var(--text);
    padding: 25px 15px;
    box-shadow: 8px 8px 0px var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px; /* Reduced gap from 15px to 4px to pull text closer */
    min-height: 160px;
  }

  .task-name {
    font-size: 48px;
    line-height: 1;
    word-break: break-word;
    margin: 0;
  }

  .assignee {
    font-size: 22px;
    background: var(--task-white);
    padding: 4px 12px;
    margin: 0;
  }

  .assignee-label {
    font-size: 18px;
    margin-right: 8px;
  }

  .stamp-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    background: var(--btn-green);
    border: 4px solid var(--text);
    padding: 16px;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    font-size: 32px;
    color: var(--text);
    box-shadow: 6px 6px 0px var(--text);
    transition: transform 0.08s step-end, box-shadow 0.08s step-end, background 0.08s step-end;
    touch-action: manipulation;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .stamp-btn:active {
    transform: translate(6px, 6px);
    box-shadow: 0px 0px 0px var(--text);
    background: var(--btn-active);
  }

  .instruction-text {
    font-size: 20px;
    padding: 6px 12px;
    align-self: center;
  }

  /* Done state */
  .card.done .stamp-btn { pointer-events: none; opacity: 0; display: none !important; }

  .ink-stamp {
    position: absolute;
    display: none;
    top: 83%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-10deg);
    font-size: 50px;
    color: var(--task-white);
    background: var(--red);
    border: 6px solid var(--text);
    padding: 5px 25px;
    pointer-events: none;
    z-index: 2;
    box-shadow: 8px 8px 0px var(--text);
  }

  .card.done .ink-stamp {
    display: block;
    animation: stampIn 0.2s steps(2, end);
  }

  @keyframes stampIn {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.5); opacity: 0; }
    100% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 1; }
  }

  .card.done .task-block { 
    opacity: 0.5; 
  }

  .error-card .task-block {
    background: var(--red);
    color: var(--task-white);
  }
</style>
</head>
<body>

<div class="frame">
  <div class="card" id="card">
    
    <div class="status-bar">
      <span id="sysTime">00:00</span>
      <span id="choreId">[ CHORE # ]</span>
    </div>

    <div class="nav-header" id="eyebrow">CHORE CHECK-IN</div>
    
    <div class="task-block">
      <div class="task-name" id="taskName">LOADING...</div>
      
      <div class="assignee" id="assignee" style="display:none;">
        <span class="assignee-label">ASSIGNEE:</span><span id="assigneeName"></span>
      </div>
    </div>

    <button class="stamp-btn" id="stampBtn" style="display:none;">
      ✔ DONE
    </button>

    <div class="instruction-text" id="statusLine"></div>
    
    <div class="ink-stamp" id="inkStamp">DONE</div>
  </div>
</div>

<script>
(function () {
  // --- UI Updates: Clock & Audio ---
  function updateClock() {
    const now = new Date();
    document.getElementById('sysTime').textContent = now.toLocaleTimeString('en-US', { 
      hour12: false, hour: '2-digit', minute: '2-digit' 
    });
  }
  setInterval(updateClock, 1000);
  updateClock();

  function playArcadeBeep() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      
      osc.type = 'square'; // 8-bit sound
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
      
      gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {
      console.log('Audio disabled or unsupported');
    }
  }

  // --- Core Logic ---
  var API_BASE = '/api/v1.0/task-assignments/acknowledge';

  var params = new URLSearchParams(window.location.search);
  var taskId = params.get('taskId');
  document.getElementById('choreId').textContent = '[ CHORE #' + taskId +' ]'

  var card = document.getElementById('card');
  var taskNameEl = document.getElementById('taskName');
  var assigneeEl = document.getElementById('assignee');
  var assigneeNameEl = document.getElementById('assigneeName');
  var stampBtn = document.getElementById('stampBtn');
  var statusLine = document.getElementById('statusLine');
  var eyebrow = document.getElementById('eyebrow');

  function showError(message) {
    card.classList.add('error-card');
    eyebrow.textContent = 'SYSTEM ERR';
    eyebrow.style.background = 'var(--red)';
    taskNameEl.textContent = message;
    assigneeEl.style.display = 'none';
    stampBtn.style.display = 'none';
    statusLine.style.display = 'none';
  }

  function renderAssignee(personName) {
    if (personName) {
      assigneeNameEl.textContent = personName;
      assigneeEl.style.display = 'block';
    } else {
      assigneeEl.style.display = 'none';
    }
  }

  function renderPending(data) {
    taskNameEl.textContent = data.taskName;
    renderAssignee(data.personName);
    stampBtn.style.display = 'flex';
    statusLine.textContent = 'TAP DONE WHEN FINISHED.';
  }

  function renderDone(data) {
    taskNameEl.textContent = data.taskName;
    renderAssignee(data.personName);
    stampBtn.style.display = 'none';
    card.classList.add('done');
    statusLine.textContent = '---';
  }

  if (!taskId) {
    showError('MISSING ID.');
    return;
  }

  fetch(API_BASE + '/' + encodeURIComponent(taskId))
    .then(function (res) {
      if (res.status === 404) throw new Error('not_found');
      if (!res.ok) throw new Error('server_error');
      return res.json();
    })
    .then(function (data) {
      if (data.status === 'DONE') {
        renderDone(data);
      } else {
        renderPending(data);
      }
    })
    .catch(function (err) {
      if (err.message === 'not_found') {
        showError('CHORE UNRECOGNIZED.');
      } else {
        showError('CONNECTION FAILED.');
      }
    });

  stampBtn.addEventListener('click', function () {
    playArcadeBeep();
    stampBtn.disabled = true;
    stampBtn.style.pointerEvents = 'none';

    fetch(API_BASE + '/' + encodeURIComponent(taskId), { method: 'POST' })
      .then(function (res) {
        if (!res.ok) throw new Error('server_error');
        return res.json();
      })
      .then(function (data) {
        renderDone(data);
      })
      .catch(function () {
        stampBtn.disabled = false;
        stampBtn.style.pointerEvents = 'auto';
        statusLine.textContent = 'ERROR — TRY AGAIN.';
        statusLine.style.borderColor = 'var(--red)';
        statusLine.style.color = 'var(--red)';
      });
  });
})();
</script>

</body>
</html>
